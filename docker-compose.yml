  #     - POSTGRES_DB=loongguard
  #     - POSTGRES_USER=${POSTGRES_USER:-loongguard}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - loongguard-network

  # ── 监控（可选）────────────────────────────────────────────
