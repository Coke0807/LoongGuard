  #     - LG_WS_URL=ws://backend:8080/ws/alerts
  #   networks:
  #     - loongguard-network

  # ── 数据库（可选，如果需要外部数据库）────────────────────
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: loongguard-postgres
  #   restart: unless-stopped
