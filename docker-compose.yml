# ─────────────────────────────────────────────────────────────
# LoongGuard Docker Compose 配置
# 基于 LoongArch 的幼儿园 AI 安全卫士
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:
  # ── 后端服务 ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loongguard-backend
    restart: unless-stopped
    ports:
      - "${LG_API_PORT:-8080}:8080"
    volumes:
      # 配置文件
      - ./.env:/app/.env:ro
      - ./backend/config:/app/config:ro
      # 数据持久化
      - backend-data:/app/data
      # 日志
      - backend-logs:/app/logs
      # 模型文件（只读）
      - ./backend/models:/app/models:ro
    environment:
      - LG_ENV=${LG_ENV:-development}
      - LG_API_PORT=8080
      - LG_SM4_KEY=${LG_SM4_KEY}
      - LG_AUTH_USER=${LG_AUTH_USER}
      - LG_AUTH_PASS=${LG_AUTH_PASS}
    networks:
      - loongguard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ── 前端服务（可选）──────────────────────────────────────
  # 如果需要运行 PyQt6 前端，需要在宿主机运行或使用 X11 转发
  # frontend:
