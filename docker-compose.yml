# ── 卷定义 ─────────────────────────────────────────────────
volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
  # postgres-data:
  #   driver: local
  # prometheus-data:
  #   driver: local
  # grafana-data:
  #   driver: local

# ── 网络定义 ───────────────────────────────────────────────
networks:
  loongguard-network:
    driver: bridge
