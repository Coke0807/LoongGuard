# ─────────────────────────────────────────────────────────────
# LoongGuard - Python 项目元数据 (PEP 621)
# 基于 LoongArch 的幼儿园 AI 安全卫士
# ─────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loongguard"
version = "0.1.0"
description = "基于 LoongArch 的幼儿园端侧 AI 安全监护系统"
readme = "README.md"
# 统一 Python 版本约束：3.11+ 支持 str | None 语法和 match 语句
# 板端实际使用 Python 3.13.5，开发机使用 3.13.x
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "LoongGuard Team"},
]

# ── 核心运行时依赖（同步自 requirements.txt） ──────────────
# 设计动机：运行时推理仅依赖 onnxruntime，torch/ultralytics 只在
# 训练/模型转换阶段使用（GB 级体积），故移入可选依赖组 train，
# 板端部署安装 requirements_loongarch.txt 即可，无需拖入训练栈。
dependencies = [
    # 推理引擎
    "onnxruntime>=1.16.0",
    # 计算机视觉
    "opencv-python>=4.8.0",
    # 数值计算
    "numpy>=1.24.0",
    # 国密 SM4 加密
    "gmssl>=3.2.0",
    # 后端 API 服务
    "aiohttp>=3.9.0",
    # SSH 远程同步 (scripts/sync.py, remote_exec.py)
    "paramiko>=3.3.0",
    # Prometheus 监控指标
    "prometheus-client>=0.19.0",
    # 家长端（微信小程序 + 管理后台）
    "aiohttp-jinja2>=1.6",
    "Jinja2>=3.1.0",
    "PyJWT>=2.8.0",
    "passlib>=1.7.4",
    "openpyxl>=3.1.0",
    # 语音模块
    "openwakeword>=0.6.0",
    "pocketsphinx>=5.1.1",
    "pyttsx3>=2.90",
]

# ── 可选依赖组 ───────────────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
# 龙芯 LG200 定制版 onnxruntime-gpu，需手动下载 wheel 安装
gpu = [
    "onnxruntime-gpu>=1.16.0",
]

# ── Pytest 配置 ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

# ── Ruff 代码检查配置 ────────────────────────────────────────
# 规则集说明：
#   E/W  pycodestyle 风格问题
#   F    pyflakes 逻辑错误（未定义名、未使用导入等）
#   I    isort 导入排序
#   B    flake8-bugbear 常见 bug 模式
#   UP   pyupgrade 语法现代化（目标 py311）
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts", "."]
extend-exclude = ["models", "deploy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    # UP042 (str,Enum) -> StrEnum 会改变 str()/format() 序列化行为，
    # 涉及 API/DB 序列化路径，收益低风险高，保持现状
    "UP042",
]

[tool.ruff.lint.isort]
# 与现有代码风格一致：第三方库后空一行再导入本地包
known-first-party = ["loongguard", "config"]

# ── Setuptools 包发现 ────────────────────────────────────────
# src-layout: 包位于 src/ 目录下，config 位于项目根目录
[tool.setuptools.packages.find]
where = [".", "src"]
include = ["config*", "loongguard*"]
