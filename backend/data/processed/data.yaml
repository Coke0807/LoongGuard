# YOLO26-Nano 训练数据集配置
#
# 检测类别：幼儿园场景中的 8 类高危物品
# 数据格式：YOLO (txt 标注文件，每行 class_id x_center y_center width height)
# 训练前需按 7:2:1 划分 train/val/test

# 数据集路径（相对于项目根目录，或绝对路径）
path: data/processed
train: images/train
val: images/val
test: images/test

# 类别数量
nc: 8

# 类别名称（与 DetectionConfig.classes 保持一致）
names:
  0: magnetic_bead       # 磁力珠
  1: button_battery      # 纽扣电池
  2: scissors            # 剪刀
  3: utility_knife       # 美工刀
  4: needle              # 别针/针
  5: glass_shard         # 碎玻璃
  6: wire                # 铁丝/细金属
  7: small_toy_part      # 微小玩具零件
