{% extends "base.html" %}
{% block body %}
<div class="layout-wrap">
    <div class="sidebar">
        <div class="sidebar-logo">
            <h3><i class="fa-solid fa-child-reaching"></i>幼儿园 AI 安全卫士后端管理系统</h3>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/admin/index"><i class="fa-solid fa-house"></i> 首页仪表盘</a></li>
            <li><a href="/admin/student"><i class="fa-solid fa-child"></i> 幼儿管理</a></li>
            <li><a href="/admin/class"><i class="fa-solid fa-chalkboard-user"></i> 班级管理</a></li>
            <li><a href="/admin/parent"><i class="fa-solid fa-users"></i> 家长管理</a></li>
            <li><a href="/admin/import"><i class="fa-solid fa-file-import"></i> 批量导入</a></li>
            <li><a href="/admin/growth" class="active"><i class="fa-solid fa-camera"></i> 成长记录</a></li>
            <li><a href="/admin/notice"><i class="fa-solid fa-bullhorn"></i> 公告管理</a></li>
            <li><a href="/admin/account"><i class="fa-solid fa-user-shield"></i> 管理员账号</a></li>
            <li><a href="/admin/logout"><i class="fa-solid fa-right-from-bracket"></i> 退出登录</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2 class="page-title"><i class="fa-solid fa-camera"></i> 成长记录管理</h2>
            <button class="btn btn-pink" onclick="openAddModal()">新增成长记录</button>
        </div>
        <div class="card">
            <div style="display:flex;gap:10px;margin-bottom:15px;">
                <input class="form-input" id="searchKey" placeholder="搜索标题" style="width:300px;">
                <button class="btn btn-pink" onclick="loadList(1)">搜索</button>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>图片</th>
                            <th>标题</th>
                            <th>记录日期</th>
                            <th>关联幼儿</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="growthTbody"></tbody>
                </table>
            </div>
            <div class="pagination" id="pageBox"></div>
        </div>
    </div>
</div>

<!-- 新增弹窗 -->
<div class="modal-mask" id="addModal">
    <div class="modal-box">
        <div class="modal-head">
            <span>新增成长记录</span>
            <span class="modal-close">&times;</span>
        </div>
        <div class="form-item">
            <label>标题</label>
            <input class="form-input" id="addTitle" required>
        </div>
        <div class="form-item">
            <label>记录日期</label>
            <input class="form-input" id="addDate" type="date" required>
        </div>
        <div class="form-item">
            <label>关联幼儿（可选）</label>
            <select class="form-input" id="addStudentId">
                <option value="0">不关联</option>
            </select>
        </div>
        <div class="form-item">
            <label>图片</label>
            <input type="file" id="addImage" accept="image/*" required>
        </div>
        <div style="text-align:right;margin-top:20px;">
            <button class="btn btn-gray" onclick="closeModal('addModal')">取消</button>
            <button class="btn btn-pink" onclick="doAdd()">提交</button>
        </div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-mask" id="editModal">
    <div class="modal-box">
        <div class="modal-head">
            <span>编辑成长记录</span>
            <span class="modal-close">&times;</span>
        </div>
        <input type="hidden" id="editId">
        <div class="form-item">
            <label>标题</label>
            <input class="form-input" id="editTitle" required>
        </div>
        <div class="form-item">
            <label>记录日期</label>
            <input class="form-input" id="editDate" type="date" required>
        </div>
        <div class="form-item">
            <label>关联幼儿（可选）</label>
            <select class="form-input" id="editStudentId">
                <option value="0">不关联</option>
            </select>
        </div>
        <div class="form-item">
            <label>图片（不选则保留原图）</label>
            <input type="file" id="editImage" accept="image/*">
        </div>
        <div id="editCurrentImage" style="margin-bottom:10px;"></div>
        <div style="text-align:right;margin-top:20px;">
            <button class="btn btn-gray" onclick="closeModal('editModal')">取消</button>
            <button class="btn btn-pink" onclick="doEdit()">保存</button>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
const pageSize = 10;
let studentList = [];

// 加载学生列表（用于下拉选择）
async function loadStudents() {
    const res = await request('/api/admin/student/list?page=1&page_size=9999');
    studentList = res.data || [];
    const addSel = document.getElementById('addStudentId');
    const editSel = document.getElementById('editStudentId');
    addSel.innerHTML = '<option value="0">不关联</option>';
    editSel.innerHTML = '<option value="0">不关联</option>';
    studentList.forEach(s => {
        addSel.innerHTML += `<option value="${s.id}">${s.student_name}（${s.class_name}）</option>`;
        editSel.innerHTML += `<option value="${s.id}">${s.student_name}（${s.class_name}）</option>`;
    });
}

async function loadList(page) {
    currentPage = page;
    const keyword = document.getElementById('searchKey').value.trim();
    const res = await request(`/api/admin/growth/list?page=${page}&page_size=${pageSize}&keyword=${keyword}`);
    const tbody = document.getElementById('growthTbody');
    tbody.innerHTML = '';
    res.data.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${item.id}</td>
            <td><img src="${item.image_path}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;"></td>
            <td>${item.title}</td>
            <td>${item.record_date}</td>
            <td>${item.student_name || '-'}</td>
            <td>${item.create_time}</td>
            <td>
                <button class="btn btn-sm btn-warning" onclick="openEdit(${item.id}, '${item.title}', '${item.record_date}', ${item.student_id || 0}, '${item.image_path}')">编辑</button>
                <button class="btn btn-sm btn-danger" onclick="doDelete(${item.id})">删除</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
    renderPagination(res.total, page, pageSize, loadList);
}

function openAddModal() {
    document.getElementById('addTitle').value = '';
    document.getElementById('addDate').value = '';
    document.getElementById('addStudentId').value = '0';
    document.getElementById('addImage').value = '';
    openModal('addModal');
}

async function doAdd() {
    const title = document.getElementById('addTitle').value.trim();
    const record_date = document.getElementById('addDate').value;
    const student_id = document.getElementById('addStudentId').value;
    const fileInput = document.getElementById('addImage');
    if (!title || !record_date) { msg('请填写标题和日期'); return; }
    if (!fileInput.files || fileInput.files.length === 0) { msg('请选择图片'); return; }
    const formData = new FormData();
    formData.append('image', fileInput.files[0]);
    const url = `/api/admin/growth/add?title=${encodeURIComponent(title)}&record_date=${encodeURIComponent(record_date)}&student_id=${student_id}`;
    const resp = await fetch(url, { method: 'POST', body: formData });
    const data = await resp.json();
    if (data.code === 0) {
        msg('添加成功');
        closeModal('addModal');
        loadList(1);
    } else {
        msg(data.msg || '添加失败');
    }
}

function openEdit(id, title, record_date, student_id, image_path) {
    document.getElementById('editId').value = id;
    document.getElementById('editTitle').value = title;
    document.getElementById('editDate').value = record_date;
    document.getElementById('editStudentId').value = student_id || 0;
    document.getElementById('editImage').value = '';
    document.getElementById('editCurrentImage').innerHTML = `<img src="${image_path}" style="width:100px;height:100px;object-fit:cover;border-radius:6px;">`;
    openModal('editModal');
}

async function doEdit() {
    const id = document.getElementById('editId').value;
    const title = document.getElementById('editTitle').value.trim();
    const record_date = document.getElementById('editDate').value;
    const student_id = document.getElementById('editStudentId').value;
    const fileInput = document.getElementById('editImage');
    if (!title || !record_date) { msg('请填写标题和日期'); return; }
    const formData = new FormData();
    if (fileInput.files && fileInput.files.length > 0) {
        formData.append('image', fileInput.files[0]);
    }
    const url = `/api/admin/growth/edit?id=${id}&title=${encodeURIComponent(title)}&record_date=${encodeURIComponent(record_date)}&student_id=${student_id}`;
    const resp = await fetch(url, { method: 'PUT', body: formData });
    const data = await resp.json();
    if (data.code === 0) {
        msg('更新成功');
        closeModal('editModal');
        loadList(currentPage);
    } else {
        msg(data.msg || '更新失败');
    }
}

async function doDelete(id) {
    if (!confirm('确认删除该成长记录？')) return;
    const res = await request(`/api/admin/growth/delete?id=${id}`, 'DELETE');
    if (res.code === 0) {
        msg('删除成功');
        loadList(currentPage);
    } else {
        msg(res.msg || '删除失败');
    }
}

window.onload = async () => {
    await loadStudents();
    loadList(1);
};
</script>
{% endblock %}
